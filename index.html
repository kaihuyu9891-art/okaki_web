<body>
  <!--1アイコンとなまえヘッド-->

<img src="img/IMG_0264.JPG" alt="アイコン" class="icon" width="500">

    <div class="work-item">

    </div>
    <div class="work-item">
      <img src="img/CEDCEC59-5F58-49AA-9920-3335DF9A6B66.png" alt="演舞写真2"width="500">
      <p>2026年ふくろ祭り<br>大塚駅前の演舞の様子<br>※画質が悪かったためAIにて補正をかけています。</p>
    </div>

  <section>
    <h2>古の訪問カウンター</h2>
    <p>あなたは <span id="count-number">0</span> 人目の物好きです！</p>
    <button id="count-btn" type="button">物好きになる</button>
  </section>
